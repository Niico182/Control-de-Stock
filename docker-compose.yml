services:
  postgres:
    image: postgres:16-alpine
    container_name: control-de-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass
      POSTGRES_DB: control_de_stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data

volumes:
  postgres_data:
